<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050914">
<meta name="description" content="Personal Details Vault">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Personal Details Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#050914;--card:#0c1525;--card2:#101c30;--c:#00eaff;--g:#39ff9a;--t:#edf8ff;--m:#8ea3bc;--l:rgba(0,234,255,.2);--glow:rgba(0,234,255,.14)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,rgba(0,234,255,.18),#050914 58%);color:var(--t);font-family:system-ui,Arial,sans-serif;min-height:100vh}.app{max-width:820px;margin:auto;padding:14px 14px 32px}header{padding:20px 16px 17px;border:1px solid var(--l);border-radius:24px;background:linear-gradient(145deg,rgba(0,234,255,.09),#080e1a);box-shadow:0 0 28px var(--glow)}.brand{display:flex;align-items:center;gap:13px}.logo{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--c);border-radius:17px;color:var(--c);font-size:27px;box-shadow:0 0 20px var(--glow)}h1{font-size:20px;letter-spacing:1px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:4px}.updated{margin-top:14px;color:var(--g);font-size:11px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0 12px}.personTab{padding:12px;border-radius:13px;font-weight:800;cursor:pointer;background:transparent}.p1{color:#00eaff;border:1px solid rgba(0,234,255,.45);background:rgba(0,234,255,.1)}.p1.selected{color:#050914;background:#00eaff}.p2{color:#ff62d8;border:1px solid rgba(255,98,216,.45);background:rgba(255,98,216,.1)}.p2.selected{color:#050914;background:#ff62d8}.toolbar{margin:15px 0}.search{width:100%;padding:12px;border-radius:13px;background:#08101d;border:1px solid var(--l);color:var(--t);outline:none}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat{min-height:125px;padding:17px;border-radius:18px;border:1px solid var(--l);background:linear-gradient(145deg,rgba(0,234,255,.07),#09101e);cursor:pointer;position:relative}.cat:hover{border-color:var(--c);box-shadow:0 0 22px var(--glow)}.ico{font-size:28px;margin-bottom:13px}.cat h2{font-size:14px;margin:0 0 5px}.cat p,.info{font-size:11px;color:var(--m)}.arrow{position:absolute;right:13px;bottom:10px;color:var(--c);font-size:20px}.view{display:none}.viewhead{display:flex;align-items:center;gap:10px;margin:5px 0 13px}.viewhead h2{font-size:18px;margin:0}.back{border:1px solid var(--l);background:#0b1423;color:var(--c);border-radius:12px;padding:10px 13px;cursor:pointer}.list{display:grid;gap:10px}.item{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:var(--card2)}.name{font-weight:700;font-size:15px}.type{color:var(--c);font-size:11px;margin-top:5px}.info{margin-top:8px;line-height:1.55}.empty{padding:30px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:16px}footer{text-align:center;color:#566981;font-size:10px;margin-top:22px}.version{margin-top:7px;font-size:9px}.splash{position:fixed;inset:0;z-index:9999;background:#050914;display:grid;place-items:center;transition:opacity .45s,visibility .45s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splashbox{text-align:center}.splashicon{width:112px;height:112px;filter:drop-shadow(0 0 18px var(--glow));animation:pulse 1.5s ease-in-out infinite}.splashname{margin-top:18px;font-size:18px;letter-spacing:2px;font-weight:700}.splashver{margin-top:7px;color:var(--g);font-size:11px;letter-spacing:1px}@keyframes pulse{50%{transform:scale(1.08)}}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}#status{display:none}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="splashbox"><img class="splashicon" src="icon.svg" alt=""><div class="splashname">PERSONAL DETAILS VAULT</div><div class="splashver">VERSION v42</div></div></div>
<div id="app" class="app">
<header><div class="brand"><div class="logo">⌂</div><div><h1>PERSONAL DETAILS VAULT</h1><div class="sub">Family-access information hub</div></div></div><div class="updated">● Last updated: 29 September 2026</div></header>
<div id="people" class="people"></div>
<div id="home"><div class="toolbar"><input id="search" class="search" placeholder="Search categories or institutions…"></div><div id="grid" class="grid"></div></div>
<section id="view" class="view"><div class="viewhead"><button id="back" class="back">‹ Back</button><h2 id="title"></h2></div><div id="list" class="list"></div></section>
<div id="status"></div><footer>Personal Details Vault • No monetary values<div class="version">v42</div></footer>
</div>
<script>
const APP_VERSION='v42';
let sb=null,people={},activePerson=null,categories=[];
try{if(window.supabase&&window.SUPABASE_CONFIG)sb=window.supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey)}catch(e){console.warn(e)}
const META=[['banks','🏦','Bank Accounts'],['credit','💳','Credit Cards'],['debit','💠','Debit Cards'],['insurance','🛡️','Insurance'],['fd','📑','Fixed Deposits'],['invest','📊','Investments'],['assets','🏠','Assets'],['contacts','📞','Emergency Contacts']];
function buildCategories(p){return META.map(x=>({id:x[0],icon:x[1],name:x[2],items:p?.categories?.[x[0]]||[]}))}
function applyTheme(){let pink=people[activePerson]?.person==='R Krithic';document.documentElement.style.setProperty('--c',pink?'#ff62d8':'#00eaff');document.documentElement.style.setProperty('--l',pink?'rgba(255,98,216,.2)':'rgba(0,234,255,.2)');document.documentElement.style.setProperty('--glow',pink?'rgba(255,98,216,.14)':'rgba(0,234,255,.14)')}
function renderPeople(){const h=document.getElementById('people');h.innerHTML=Object.keys(people).map((id,i)=>{const n=people[id].person||('Person '+(i+1));return '<button class="personTab '+(n==='R Darshan'?'p1':'p2')+(id===activePerson?' selected':'')+'" data-id="'+id+'">'+n+'</button>'}).join('');h.querySelectorAll('button').forEach(b=>b.onclick=()=>switchPerson(b.dataset.id))}
function switchPerson(id){if(!people[id])return;activePerson=id;categories=buildCategories(people[id]);applyTheme();renderPeople();renderHome();document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';scrollTo(0,0)}
function renderHome(q=''){q=String(q).toLowerCase().trim();const a=categories.filter(c=>!q||c.name.toLowerCase().includes(q)||c.items.some(i=>JSON.stringify(i).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=a.map(c=>'<div class="cat" data-cat="'+c.id+'"><div class="ico">'+c.icon+'</div><h2>'+c.name+'</h2><p>'+c.items.length+' records</p><div class="arrow">›</div></div>').join('')||'<div class="empty">No matching information</div>';document.querySelectorAll('.cat').forEach(e=>e.onclick=()=>openCat(e.dataset.cat))}
function openCat(id){const c=categories.find(x=>x.id===id);if(!c)return;document.getElementById('home').style.display='none';document.getElementById('view').style.display='block';document.getElementById('title').textContent=c.name;document.getElementById('list').innerHTML=c.items.map(i=>{if(!Array.isArray(i))return '<div class="item"><div class="info">'+JSON.stringify(i)+'</div></div>';return '<div class="item"><div class="name">'+(i[0]||'')+'</div><div class="type">'+(i[1]||'')+'</div><div class="info">'+(i[2]||'')+'</div></div>'}).join('')||'<div class="empty">No records</div>';scrollTo(0,0)}
document.getElementById('search').oninput=e=>renderHome(e.target.value);document.getElementById('back').onclick=()=>{document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';scrollTo(0,0)};
async function loadPeople(){if(!sb)return;const a=await sb.from('vault_people').select('id,display_name');if(a.error)throw a.error;const b=await sb.from('vault_records').select('person_id,category,data');if(b.error)throw b.error;const n={};(a.data||[]).forEach(p=>n[p.id]={person:p.display_name,categories:{}});(b.data||[]).forEach(r=>{if(!n[r.person_id])return;(n[r.person_id].categories[r.category]??=[]).push(r.data)});people=n;if(!Object.keys(people).length)return;activePerson=Object.keys(people).find(id=>people[id].person==='R Darshan')||Object.keys(people)[0];categories=buildCategories(people[activePerson]);applyTheme();renderPeople();renderHome()}
function start(){people={darshan:{person:'R Darshan',categories:{}},krithic:{person:'R Krithic',categories:{}}};activePerson='darshan';categories=buildCategories(people.darshan);applyTheme();renderPeople();renderHome();document.getElementById('app').style.display='block';setTimeout(()=>document.getElementById('splash').classList.add('hide'),2000);loadPeople().catch(e=>console.warn('Supabase load failed',e))}
start();
</script>
</body>
</html>
