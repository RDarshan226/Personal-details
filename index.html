<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Details Vault</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050914;
      color: #edf8ff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(420px, 92vw);
      background: #101c30;
      border: 1px solid rgba(0, 234, 255, 0.25);
      border-radius: 12px;
      padding: 26px;
      box-shadow: 0 0 30px rgba(0, 234, 255, 0.15);
    }

    h2 {
      margin-top: 0;
      color: #00eaff;
      font-size: 22px;
    }

    p {
      color: #8ea3bc;
      line-height: 1.4;
      margin-bottom: 18px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid rgba(0, 234, 255, 0.25);
      border-radius: 8px;
      background: #0c1525;
      color: #edf8ff;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #00eaff;
      box-shadow: 0 0 8px rgba(0, 234, 255, 0.18);
    }

    button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #00eaff, #0088ff);
      color: #050914;
      font-weight: 700;
      cursor: pointer;
    }

    #message {
      margin-top: 12px;
      min-height: 22px;
      color: #39ff9a;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Sign in to Personal Details Vault</h2>
    <p>Your personal information is stored in Supabase and is not loaded from the public GitHub JSON files.</p>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button type="button" onclick="doLogin()">Login</button>
    <button type="button" onclick="doSignup()">Create Account</button>

    <div id="message"></div>
  </div>

  <script>
    function showMessage(value) {
      document.getElementById('message').textContent = value;
    }

    let sbClient = null;

    try {
      if (!window.SUPABASE_CONFIG) {
        throw new Error('Supabase config missing');
      }

      if (typeof supabase === 'undefined') {
        throw new Error('Supabase SDK not loaded');
      }

      sbClient = supabase.createClient(
        window.SUPABASE_CONFIG.url,
        window.SUPABASE_CONFIG.publishableKey
      );

      console.log('Supabase initialized');
    } catch (error) {
      console.error('Supabase init failed:', error);
      showMessage(error.message || 'Supabase failed');
    }

    async function doLogin() {
      if (!sbClient) {
        showMessage('Supabase client not ready');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Enter email and password');
        return;
      }

      showMessage('Signing in...');

      try {
        const { data, error } = await sbClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showMessage(error.message);
          return;
        }

        showMessage('Login successful');
        console.log('Logged in:', data);
      } catch (error) {
        console.error('Login error:', error);
        showMessage(error.message || 'Login failed');
      }
    }

    async function doSignup() {
      if (!sbClient) {
        showMessage('Supabase client not ready');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Enter email and password');
        return;
      }

      showMessage('Creating account...');

      try {
        const { data, error } = await sbClient.auth.signUp({
          email,
          password
        });

        if (error) {
          showMessage(error.message);
          return;
        }

        showMessage('Account created. Check your email for confirmation.');
        console.log('Signup response:', data);
      } catch (error) {
        console.error('Signup error:', error);
        showMessage(error.message || 'Signup failed');
      }
    }
  </script>
</body>
</html>
