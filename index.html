<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><meta name="description" content="Personal Details Vault"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Personal Details Vault</title><style>
:root{--bg:#050914;--p:#0c1525;--p2:#101c30;--c:#00eaff;--g:#39ff9a;--t:#edf8ff;--m:#8ea3bc;--l:rgba(0,234,255,.2)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12335b,#050914 48%);color:var(--t);font-family:system-ui,Arial,sans-serif;min-height:100vh}.app{max-width:820px;margin:auto;padding:14px 14px 32px}header{padding:20px 16px 17px;border:1px solid var(--l);border-radius:24px;background:linear-gradient(145deg,#0d1b30,#080e1a);box-shadow:0 0 28px rgba(0,234,255,.08)}.brand{display:flex;align-items:center;gap:13px}.logo{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--c);border-radius:17px;color:var(--c);box-shadow:0 0 20px rgba(0,234,255,.3);font-size:27px}h1{font-size:20px;letter-spacing:1px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:4px}.updated{margin-top:14px;color:var(--g);font-size:11px}.toolbar{margin:15px 0}.search{width:100%;padding:12px;border-radius:13px;background:#08101d;border:1px solid var(--l);color:var(--t);outline:none}.search:focus{border-color:var(--c);box-shadow:0 0 12px rgba(0,234,255,.12)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat{min-height:125px;padding:17px;border-radius:18px;border:1px solid var(--l);background:linear-gradient(145deg,#0d1728,#09101e);cursor:pointer;position:relative;transition:.16s}.cat:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 0 22px rgba(0,234,255,.13)}.ico{font-size:28px;margin-bottom:13px}.cat h2{font-size:14px;margin:0 0 5px}.cat p{font-size:11px;color:var(--m);margin:0}.arrow{position:absolute;right:13px;bottom:10px;color:var(--c);font-size:20px}.view{display:none}.viewhead{display:flex;align-items:center;gap:10px;margin:5px 0 13px}.viewhead h2{font-size:18px;margin:0}.back{border:1px solid var(--l);background:#0b1423;color:var(--c);border-radius:12px;padding:10px 13px}.list{display:grid;gap:10px}.item{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:var(--p2)}.name{font-weight:700;font-size:15px}.type{color:var(--c);font-size:11px;margin-top:5px}.info{color:var(--m);font-size:12px;margin-top:8px;line-height:1.55}.badge{float:right;border:1px solid rgba(57,255,154,.35);color:var(--g);border-radius:20px;padding:3px 8px;font-size:9px}.empty{padding:30px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:16px}footer{text-align:center;color:#566981;font-size:10px;margin-top:22px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
 .splash{position:fixed;inset:0;z-index:9999;background:#050914;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s ease}.splash.hide{opacity:0;visibility:hidden}.splashbox{text-align:center;animation:splashIn .8s ease both}.splashicon{width:112px;height:112px;filter:drop-shadow(0 0 18px rgba(0,234,255,.55));animation:pulse 1.5s ease-in-out infinite}.splashname{margin-top:18px;font-size:18px;letter-spacing:2px;font-weight:700}.splashver{margin-top:7px;color:var(--g);font-size:11px;letter-spacing:1px}@keyframes splashIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}} .version{text-align:center;color:#566981;font-size:9px;margin-top:7px}</style></head><body><div id="splash" class="splash"><div class="splashbox"><img class="splashicon" src="icon.svg" alt=""><div class="splashname">PERSONAL DETAILS VAULT</div><div class="splashver">VERSION v64</div></div></div><div class="app"><header><div class="brand"><div class="logo">⌂</div><div><h1>PERSONAL DETAILS VAULT</h1><div class="sub">Family-access information hub</div></div></div><div class="updated">● Last updated: 29 September 2026</div></header><div id="home"><div class="toolbar"><input id="search" class="search" placeholder="Search categories or institutions…" oninput="renderHome(this.value)"></div><div id="grid" class="grid"></div></div><section id="view" class="view"><div class="viewhead"><button class="back" onclick="goHome()">‹ Back</button><h2 id="title"></h2></div><div id="list" class="list"></div></section><footer>Personal Details Vault • No monetary values<div class="version">v64</div></footer></div><script>
const APP_VERSION='v64';
const categories=[
{id:'banks',icon:'🏦',name:'Bank Accounts',items:[['HDFC Bank','Savings Account','Branch / account reference','Active'],['ICICI Bank','Savings Account','Branch / account reference','Active'],['State Bank of India','Savings Account','Branch / account reference','Active']]},
{id:'credit',icon:'💳',name:'Credit Cards',items:[['HDFC Bank','MoneyBack+','Primary credit card','Active'],['ICICI Bank','Amazon Pay ICICI','Primary credit card','Active'],['SBI Cards','SimplyCLICK','Primary credit card','Active'],['Axis Bank','Neo','Primary credit card','Active']]},
{id:'debit',icon:'💠',name:'Debit Cards',items:[['HDFC Bank','Visa Debit Card','Linked debit card','Active'],['ICICI Bank','Visa Debit Card','Linked debit card','Active']]},
{id:'insurance',icon:'🛡️',name:'Insurance',items:[['LIC','Life Insurance','Policy / nominee reference','Active'],['ICICI Lombard','Motor Insurance','Policy / claims reference','Active'],['Star Health','Health Insurance','Policy / claims reference','Active']]},
{id:'fd',icon:'📑',name:'Fixed Deposits',items:[['HDFC Bank','Fixed Deposit','Certificate / maturity reference','Active'],['ICICI Bank','Fixed Deposit','Certificate / maturity reference','Active']]},
{id:'invest',icon:'📊',name:'Investments',items:[['Zerodha','Demat / Trading','Investment account reference','Active'],['Groww','Mutual Funds','Investment platform reference','Active'],['NPS','Pension Account','Account reference','Active']]},
{id:'assets',icon:'🏠',name:'Assets',items:[['Property','Property Documents','Ownership / document reference','Active'],['Vehicle','Vehicle Documents','Registration / insurance reference','Active']]},
{id:'docs',icon:'📁',name:'Important Documents',items:[['PAN Card','Identity','Document reference','Available'],['Aadhaar','Identity','Document reference','Available'],['Passport','Identity','Document reference','Available'],['Driving Licence','Identity','Document reference','Available'],['Will','Legal','Document reference','Available']]},
{id:'contacts',icon:'📞',name:'Emergency Contacts',items:[['Primary Family Contact','Family','Phone / relationship reference','Available'],['Banking Contact','Banking','Customer-care / branch reference','Available'],['Insurance Contact','Insurance','Claims-contact reference','Available']]}];
function renderHome(q=''){let s=q.toLowerCase().trim(),a=categories.filter(c=>!s||c.name.toLowerCase().includes(s)||c.items.some(i=>i.join(' ').toLowerCase().includes(s)));document.getElementById('grid').innerHTML=a.map(c=>'<div class="cat" onclick="openCat(\''+c.id+'\')"><div class="ico">'+c.icon+'</div><h2>'+c.name+'</h2><p>'+c.items.length+' records</p><div class="arrow">›</div></div>').join('')||'<div class="empty">No matching information</div>'}
function openCat(id){let c=categories.find(x=>x.id===id);document.getElementById('home').style.display='none';document.getElementById('view').style.display='block';document.getElementById('title').textContent=c.name;document.getElementById('list').innerHTML=c.items.map(i=>'<div class="item"><span class="badge">'+i[3]+'</span><div class="name">'+i[0]+'</div><div class="type">'+i[1]+'</div><div class="info">'+i[2]+'</div></div>').join('');history.pushState({category:id},'', '#'+id);scrollTo(0,0)}
function goHome(){document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';history.pushState({},'',location.pathname+location.search);scrollTo(0,0)}
addEventListener('popstate',()=>{if(document.getElementById('view').style.display!=='none')goHome()});
function handleBack(){if(document.getElementById('view').style.display!=='none'){goHome();return true}return false}
renderHome();if(location.hash){let id=location.hash.slice(1);if(categories.some(c=>c.id===id))openCat(id)}addEventListener('load',()=>{setTimeout(()=>document.getElementById('splash').classList.add('hide'),1200);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')});
</script></body></html>
