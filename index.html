<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050914"><meta name="description" content="Personal Details Vault"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Personal Details Vault</title><style>
:root{--bg:#050914;--p:#0c1525;--p2:#101c30;--c:#00eaff;--g:#39ff9a;--t:#edf8ff;--m:#8ea3bc;--l:rgba(0,234,255,.2)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12335b,#050914 48%);color:var(--t);font-family:system-ui,Arial,sans-serif;min-height:100vh}.app{max-width:820px;margin:auto;padding:14px 14px 32px}header{padding:20px 16px 17px;border:1px solid var(--l);border-radius:24px;background:linear-gradient(145deg,#0d1b30,#080e1a);box-shadow:0 0 28px rgba(0,234,255,.08)}.brand{display:flex;align-items:center;gap:13px}.logo{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--c);border-radius:17px;color:var(--c);box-shadow:0 0 20px rgba(0,234,255,.3);font-size:27px}h1{font-size:20px;letter-spacing:1px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:4px}.updated{margin-top:14px;color:var(--g);font-size:11px}.toolbar{margin:15px 0}.search{width:100%;padding:12px;border-radius:13px;background:#08101d;border:1px solid var(--l);color:var(--t);outline:none}.search:focus{border-color:var(--c);box-shadow:0 0 12px rgba(0,234,255,.12)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat{min-height:125px;padding:17px;border-radius:18px;border:1px solid var(--l);background:linear-gradient(145deg,#0d1728,#09101e);cursor:pointer;position:relative;transition:.16s}.cat:hover{transform:translateY(-2px);border-color:var(--c);box-shadow:0 0 22px rgba(0,234,255,.13)}.ico{font-size:28px;margin-bottom:13px}.cat h2{font-size:14px;margin:0 0 5px}.cat p{font-size:11px;color:var(--m);margin:0}.arrow{position:absolute;right:13px;bottom:10px;color:var(--c);font-size:20px}.view{display:none}.viewhead{display:flex;align-items:center;gap:10px;margin:5px 0 13px}.viewhead h2{font-size:18px;margin:0}.back{border:1px solid var(--l);background:#0b1423;color:var(--c);border-radius:12px;padding:10px 13px}.list{display:grid;gap:10px}.item{padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:var(--p2)}.name{font-weight:700;font-size:15px}.type{color:var(--c);font-size:11px;margin-top:5px}.info{color:var(--m);font-size:12px;margin-top:8px;line-height:1.55}.badge{float:right;border:1px solid rgba(57,255,154,.35);color:var(--g);border-radius:20px;padding:3px 8px;font-size:9px}.empty{padding:30px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:16px}footer{text-align:center;color:#566981;font-size:10px;margin-top:22px}@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}.splash{position:fixed;inset:0;z-index:9999;background:#050914;display:grid;place-items:center;transition:opacity .45s ease,visibility .45s ease}.splash.hide{opacity:0;visibility:hidden}.splashbox{text-align:center;animation:splashIn .8s ease both}.splashicon{width:112px;height:112px;filter:drop-shadow(0 0 18px rgba(0,234,255,.55));animation:pulse 1.5s ease-in-out infinite}.splashname{margin-top:18px;font-size:18px;letter-spacing:2px;font-weight:700}.splashver{margin-top:7px;color:var(--g);font-size:11px;letter-spacing:1px}@keyframes splashIn{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.version{text-align:center;color:#566981;font-size:9px;margin-top:7px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0 12px}.personTab{padding:12px;border-radius:13px;border:1px solid transparent;font-weight:800;color:#050914;transition:.16s}.personTab.p1{background:#00eaff;border-color:#00eaff}.personTab.p1.selected{background:#00eaff;box-shadow:0 0 22px rgba(0,234,255,.35)}.personTab.p2{background:#ff62d8;border-color:#ff62d8}.personTab.p2.selected{background:#ff62d8;box-shadow:0 0 22px rgba(255,98,216,.35)}.viewonly{text-align:center;color:var(--m);font-size:10px;margin:-5px 0 12px}</style></head><body>
<div id="splash" class="splash"><div class="splashbox"><img class="splashicon" src="icon.svg" alt=""><div class="splashname">PERSONAL DETAILS VAULT</div><div class="splashver">VERSION v6</div></div></div>
<div class="app"><header><div class="brand"><div class="logo">⌂</div><div><h1>PERSONAL DETAILS VAULT</h1><div class="sub">Family-access information hub</div></div></div><div class="updated">● Last updated: 29 September 2026</div></header><div id="people" class="people"></div><div id="home"><div class="toolbar"><input id="search" class="search" placeholder="Search categories or institutions…" oninput="renderHome(this.value)"></div><div id="grid" class="grid"></div></div><section id="view" class="view"><div class="viewhead"><button class="back" onclick="goHome()">‹ Back</button><h2 id="title"></h2></div><div class="viewonly">VIEW ONLY • Edit permissions will be added separately</div><div id="list" class="list"></div></section><footer>Personal Details Vault • No monetary values<div class="version">v6</div></footer></div>
<script>
const APP_VERSION='v6';
const CATEGORY_META=[['banks','🏦','Bank Accounts'],['credit','💳','Credit Cards'],['debit','💠','Debit Cards'],['insurance','🛡️','Insurance'],['fd','📑','Fixed Deposits'],['invest','📊','Investments'],['assets','🏠','Assets'],['contacts','📞','Emergency Contacts']];
let people={};let activePerson='person1';let categories=[];
function buildCategories(data){return CATEGORY_META.map(([id,icon,name])=>({id,icon,name,items:(data&&data.categories&&Array.isArray(data.categories[id]))?data.categories[id]:[]}))}
async function loadPeople(){const responses=await Promise.all([fetch('./data/person1.json',{cache:'no-store'}),fetch('./data/person2.json',{cache:'no-store'})]);if(!responses[0].ok||!responses[1].ok)throw new Error('Unable to load person data');people.person1=await responses[0].json();people.person2=await responses[1].json();categories=buildCategories(people[activePerson]);renderPeople();renderHome();}
function renderPeople(){const h=document.getElementById('people');if(!h)return;h.innerHTML=['person1','person2'].map((p,i)=>{const label=people[p]&&people[p].person?people[p].person:'Person '+(i+1);return '<button class="personTab '+(p==='person1'?'p1':'p2')+' '+(activePerson===p?'selected':'')+'" data-person="'+p+'">'+label+'</button>';}).join('');h.querySelectorAll('.personTab').forEach(btn=>btn.addEventListener('click',()=>switchPerson(btn.dataset.person)));}
function switchPerson(p){if(!people[p])return;activePerson=p;categories=buildCategories(people[p]);document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';document.getElementById('search').value='';renderPeople();renderHome();history.pushState({person:p},'',location.pathname+location.search+'#'+p);scrollTo(0,0);}
function renderHome(q=''){const s=String(q).toLowerCase().trim();const a=categories.filter(c=>!s||c.name.toLowerCase().includes(s)||c.items.some(i=>Array.isArray(i)&&i.join(' ').toLowerCase().includes(s)));document.getElementById('grid').innerHTML=a.map(c=>'<div class="cat" data-cat="'+c.id+'"><div class="ico">'+c.icon+'</div><h2>'+c.name+'</h2><p>'+c.items.length+' records</p><div class="arrow">›</div></div>').join('')||'<div class="empty">No matching information</div>';document.querySelectorAll('.cat').forEach(el=>el.addEventListener('click',()=>openCat(el.dataset.cat)));}
function openCat(id){const c=categories.find(x=>x.id===id);if(!c)return;document.getElementById('home').style.display='none';document.getElementById('view').style.display='block';document.getElementById('title').textContent=c.name;document.getElementById('list').innerHTML=c.items.map(i=>'<div class="item"><span class="badge">'+(i[3]||'Active')+'</span><div class="name">'+(i[0]||'')+'</div><div class="type">'+(i[1]||'')+'</div><div class="info">'+(i[2]||'')+'</div></div>').join('')||'<div class="empty">No records</div>';history.pushState({category:id},'', '#'+id);scrollTo(0,0);}
function goHome(){document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';history.pushState({},'',location.pathname+location.search);scrollTo(0,0);}
addEventListener('popstate',()=>{if(document.getElementById('view').style.display!=='none')goHome();});
function hideSplash(){const s=document.getElementById('splash');if(s)s.classList.add('hide');}
addEventListener('load',()=>{setTimeout(hideSplash,2000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});});
setTimeout(hideSplash,3500);
loadPeople().catch(()=>{people.person1={person:'Person 1',categories:{}};people.person2={person:'Person 2',categories:{}};categories=buildCategories(people.person1);renderPeople();renderHome();});
</script></body></html>
